name: Build & Release App (Web + Android APK)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript Lint
        run: npm run lint

      - name: Build Web Bundle
        run: npm run build

      - name: Package Web Dist ZIP
        run: |
          cd dist
          zip -r ../RoletaLab-Web.zip .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoletaLab-Web
          path: RoletaLab-Web.zip

  build-android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build dist
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Bootstrap Capacitor Android & Build APK
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RoletaLab-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoletaLab-Android-APK
          path: RoletaLab-Android.apk

  publish-release:
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Web ZIP
        uses: actions/download-artifact@v4
        with:
          name: RoletaLab-Web

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: RoletaLab-Android-APK

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "RoletaLab ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}"
          generate_release_notes: true
          files: |
            RoletaLab-Web.zip
            RoletaLab-Android.apk
